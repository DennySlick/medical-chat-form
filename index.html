<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Appointment Chat</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --primary-light: #e8f1fd;
            --text-color: #333;
            --light-gray: #f5f5f5;
            --border-color: #ddd;
            --success-color: #4caf50;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #fff;
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .chat-container {
            width: 100%;
            max-width: 500px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            height: 80vh;
            max-height: 700px;
        }
        
        .chat-header {
            background-color: var(--primary-color);
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .chat-header h1 {
            font-size: 20px;
            font-weight: 600;
        }
        
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background-color: white;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .message {
            max-width: 80%;
            padding: 12px 15px;
            border-radius: 18px;
            line-height: 1.4;
            animation: fadeIn 0.3s ease;
            font-size: 16px;
        }
        
        .bot-message {
            background-color: var(--light-gray);
            align-self: flex-start;
            border-bottom-left-radius: 5px;
        }
        
        .user-message {
            background-color: var(--primary-light);
            color: var(--text-color);
            align-self: flex-end;
            border-bottom-right-radius: 5px;
        }
        
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            margin-top: 8px;
        }
        
        .option-button {
            background-color: white;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            text-align: left;
            transition: all 0.2s ease;
            cursor: pointer;
            font-size: 16px;
            position: relative;
            display: flex;
            align-items: center;
        }
        
        .option-button:hover {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
        }
        
        .option-button.selected {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
        }
        
        .option-button::after {
            content: "›";
            position: absolute;
            right: 15px;
            font-size: 20px;
            opacity: 0.5;
        }
        
        .doctor-card {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        
        .doctor-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: var(--primary-light);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-color);
            font-weight: bold;
            font-size: 20px;
        }
        
        .doctor-info {
            flex: 1;
        }
        
        .doctor-name {
            font-weight: 600;
            margin-bottom: 3px;
        }
        
        .doctor-specialty {
            font-size: 14px;
            color: #666;
        }
        
        .time-slot {
            display: inline-block;
            padding: 10px 15px;
            margin: 5px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .time-slot:hover {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
        }
        
        .time-slot.selected {
            background-color: var(--primary-light);
            border-color: var(--primary-color);
        }
        
        .form-group {
            margin-bottom: 15px;
            position: relative;
            width: 100%;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 25px;
            font-size: 16px;
            transition: all 0.3s ease;
            padding-right: 100px; /* Make room for the send button */
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
        }
        
        .button-container {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            box-shadow: 0 2px 5px rgba(74, 144, 226, 0.3);
        }
        
        .btn-primary:hover {
            background-color: #3a7bc8;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(74, 144, 226, 0.4);
        }
        
        .btn-primary:active {
            transform: translateY(0);
            box-shadow: 0 1px 3px rgba(74, 144, 226, 0.3);
        }
        
        .btn-outline {
            background-color: transparent;
            border: 1px solid var(--border-color);
        }
        
        .btn-outline:hover {
            background-color: var(--light-gray);
            border-color: #ccc;
        }
        
        .btn-success {
            background-color: var(--success-color);
            color: white;
            box-shadow: 0 2px 5px rgba(76, 175, 80, 0.3);
        }
        
        .btn-success:hover {
            background-color: #3d8b40;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(76, 175, 80, 0.4);
        }
        
        .btn-success:active {
            transform: translateY(0);
            box-shadow: 0 1px 3px rgba(76, 175, 80, 0.3);
        }
        
        .send-btn {
            position: absolute;
            right: 5px;
            top: 5px;
            bottom: 5px;
            padding: 0;
            width: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--primary-color);
            color: white;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(74, 144, 226, 0.3);
        }
        
        .send-btn:hover {
            background-color: #3a7bc8;
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(74, 144, 226, 0.4);
        }
        
        .send-btn:active {
            transform: scale(0.95);
        }
        
        .send-btn-icon {
            width: 18px;
            height: 18px;
            fill: white;
            margin-left: 2px;
        }
        
        .typing-indicator {
            display: flex;
            padding: 12px 15px;
            background-color: var(--light-gray);
            border-radius: 18px;
            border-bottom-left-radius: 5px;
            align-self: flex-start;
            width: fit-content;
        }
        
        .typing-indicator span {
            height: 8px;
            width: 8px;
            margin: 0 2px;
            background-color: #999;
            border-radius: 50%;
            display: inline-block;
            opacity: 0.4;
        }
        
        .typing-indicator span:nth-child(1) {
            animation: pulse 1s infinite ease-in-out;
        }
        
        .typing-indicator span:nth-child(2) {
            animation: pulse 1s infinite ease-in-out 0.2s;
        }
        
        .typing-indicator span:nth-child(3) {
            animation: pulse 1s infinite ease-in-out 0.4s;
        }
        
        @keyframes pulse {
            0%, 100% {
                transform: translateY(0px);
                opacity: 0.4;
            }
            50% {
                transform: translateY(-5px);
                opacity: 1;
            }
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes sendButtonPulse {
            0% {
                box-shadow: 0 0 0 0 rgba(74, 144, 226, 0.7);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(74, 144, 226, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(74, 144, 226, 0);
            }
        }
        
        .summary-container {
            background-color: var(--primary-light);
            border-radius: 8px;
            padding: 15px;
            margin-top: 10px;
        }
        
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        
        .summary-label {
            font-weight: 500;
            color: #666;
        }
        
        .summary-value {
            font-weight: 600;
        }
        
        .confirmation-icon {
            display: flex;
            justify-content: center;
            margin: 20px 0;
            font-size: 50px;
            color: var(--success-color);
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>Doctor Appointment</h1>
        </div>
        <div class="chat-messages" id="chat-messages">
            <!-- Messages will be added here dynamically -->
        </div>
    </div>

    <script>
        // Mock data for doctors
        const doctors = [
            { id: 1, name: "Dr. Sarah Johnson", specialty: "Cardiologist", avatar: "SJ" },
            { id: 2, name: "Dr. Michael Chen", specialty: "Dermatologist", avatar: "MC" },
            { id: 3, name: "Dr. Emily Wilson", specialty: "Neurologist", avatar: "EW" },
            { id: 4, name: "Dr. James Rodriguez", specialty: "Pediatrician", avatar: "JR" },
            { id: 5, name: "Dr. Lisa Taylor", specialty: "Psychiatrist", avatar: "LT" }
        ];

        // Mock data for time slots
        const generateTimeSlots = () => {
            const slots = [];
            const today = new Date();
            today.setHours(9, 0, 0, 0);
            
            for (let i = 0; i < 8; i++) {
                const slotTime = new Date(today.getTime() + (i * 60 * 60 * 1000));
                slots.push({
                    id: i + 1,
                    time: slotTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    available: Math.random() > 0.3
                });
            }
            
            // Add slots for tomorrow
            const tomorrow = new Date(today);
            tomorrow.setDate(tomorrow.getDate() + 1);
            tomorrow.setHours(9, 0, 0, 0);
            
            for (let i = 0; i < 8; i++) {
                const slotTime = new Date(tomorrow.getTime() + (i * 60 * 60 * 1000));
                slots.push({
                    id: i + 9,
                    time: slotTime.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    date: tomorrow.toLocaleDateString([], { month: 'short', day: 'numeric' }),
                    available: Math.random() > 0.3
                });
            }
            
            return slots.filter(slot => slot.available);
        };

        // User data
        let userData = {
            firstName: '',
            lastName: '',
            dob: '',
            selectedDoctor: null,
            selectedTimeSlot: null
        };

        // Chat flow controller
        class ChatFlow {
            constructor() {
                this.messagesContainer = document.getElementById('chat-messages');
                this.currentStep = 'welcome';
                this.availableTimeSlots = [];
                this.init();
            }

            init() {
                this.addBotMessage("👋 Hello! I'll help you schedule a doctor's appointment.");
                setTimeout(() => {
                    this.askFirstNameStep();
                }, 1000);
            }

            addBotMessage(message, delay = 0) {
                setTimeout(() => {
                    // Show typing indicator
                    const typingIndicator = document.createElement('div');
                    typingIndicator.className = 'typing-indicator';
                    typingIndicator.innerHTML = '<span></span><span></span><span></span>';
                    this.messagesContainer.appendChild(typingIndicator);
                    this.messagesContainer.scrollTop = this.messagesContainer.scrollHeight;
                    
                    // Show actual message after typing animation
                    setTimeout(() => {
                        this.messagesContainer.removeChild(typingIndicator);
                        const messageElement = document.createElement('div');
                        messageElement.className = 'message bot-message';
                        messageElement.innerHTML = message;
                        this.messagesContainer.appendChild(messageElement);
                        this.messagesContainer.scrollTop = this.messagesContainer.scrollHeight;
                    }, 1500);
                }, delay);
            }

            addUserMessage(message) {
                const messageElement = document.createElement('div');
                messageElement.className = 'message user-message';
                messageElement.textContent = message;
                this.messagesContainer.appendChild(messageElement);
                this.messagesContainer.scrollTop = this.messagesContainer.scrollHeight;
            }

            // Ask for first name in a chat-like manner
            askFirstNameStep() {
                this.currentStep = 'askFirstName';
                this.addBotMessage("To get started, could you tell me your first name?", 500);
                
                setTimeout(() => {
                    const inputHTML = `
                        <div class="message bot-message">
                            <div class="form-group">
                                <input type="text" id="firstName" placeholder="Type your first name..." 
                                    style="border-radius: 25px; padding-left: 15px;">
                                <button class="send-btn" id="submitFirstName" title="Send">
                                    <svg class="send-btn-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    `;
                    
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = inputHTML;
                    const inputElement = tempDiv.firstElementChild;
                    this.messagesContainer.appendChild(inputElement);
                    this.messagesContainer.scrollTop = this.messagesContainer.scrollHeight;
                    
                    const firstNameInput = document.getElementById('firstName');
                    firstNameInput.focus();
                    
                    const submitFirstName = () => {
                        const firstName = firstNameInput.value.trim();
                        if (!firstName) {
                            firstNameInput.classList.add('error');
                            return;
                        }
                        
                        userData.firstName = firstName;
                        this.addUserMessage(firstName);
                        
                        inputElement.style.display = 'none';
                        this.askLastNameStep();
                    };
                    
                    document.getElementById('submitFirstName').addEventListener('click', submitFirstName);
                    firstNameInput.addEventListener('keypress', (e) => {
                        if (e.key === 'Enter') {
                            submitFirstName();
                        }
                    });
                }, 2000);
            }
            
            // Ask for last name in a chat-like manner
            askLastNameStep() {
                this.currentStep = 'askLastName';
                this.addBotMessage(`Nice to meet you, ${userData.firstName}! What's your last name?`, 500);
                
                setTimeout(() => {
                    const inputHTML = `
                        <div class="message bot-message">
                            <div class="form-group">
                                <input type="text" id="lastName" placeholder="Type your last name..." 
                                    style="border-radius: 25px; padding-left: 15px;">
                                <button class="send-btn" id="submitLastName" title="Send">
                                    <svg class="send-btn-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    `;
                    
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = inputHTML;
                    const inputElement = tempDiv.firstElementChild;
                    this.messagesContainer.appendChild(inputElement);
                    this.messagesContainer.scrollTop = this.messagesContainer.scrollHeight;
                    
                    const lastNameInput = document.getElementById('lastName');
                    lastNameInput.focus();
                    
                    const submitLastName = () => {
                        const lastName = lastNameInput.value.trim();
                        if (!lastName) {
                            lastNameInput.classList.add('error');
                            return;
                        }
                        
                        userData.lastName = lastName;
                        this.addUserMessage(lastName);
                        
                        inputElement.style.display = 'none';
                        this.askDobStep();
                    };
                    
                    document.getElementById('submitLastName').addEventListener('click', submitLastName);
                    lastNameInput.addEventListener('keypress', (e) => {
                        if (e.key === 'Enter') {
                            submitLastName();
                        }
                    });
                }, 2000);
            }
            
            // Ask for date of birth in a chat-like manner
            askDobStep() {
                this.currentStep = 'askDob';
                this.addBotMessage("And what's your date of birth?", 500);
                
                setTimeout(() => {
                    const inputHTML = `
                        <div class="message bot-message">
                            <div class="form-group">
                                <input type="date" id="dob" style="border-radius: 25px; padding-left: 15px;">
                                <button class="send-btn" id="submitDob" title="Send">
                                    <svg class="send-btn-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    `;
                    
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = inputHTML;
                    const inputElement = tempDiv.firstElementChild;
                    this.messagesContainer.appendChild(inputElement);
                    this.messagesContainer.scrollTop = this.messagesContainer.scrollHeight;
                    
                    const dobInput = document.getElementById('dob');
                    dobInput.focus();
                    
                    const submitDob = () => {
                        const dob = dobInput.value;
                        if (!dob) {
                            dobInput.classList.add('error');
                            return;
                        }
                        
                        userData.dob = dob;
                        this.addUserMessage(new Date(dob).toLocaleDateString());
                        
                        inputElement.style.display = 'none';
                        
                        // Add a summary message
                        this.addBotMessage(`Thank you for providing your information, ${userData.firstName}!`, 500);
                        
                        setTimeout(() => {
                            this.doctorSelectionStep();
                        }, 2000);
                    };
                    
                    document.getElementById('submitDob').addEventListener('click', submitDob);
                    dobInput.addEventListener('keypress', (e) => {
                        if (e.key === 'Enter') {
                            submitDob();
                        }
                    });
                }, 2000);
            }

            doctorSelectionStep() {
                this.currentStep = 'doctorSelection';
                this.addBotMessage(`Thanks, ${userData.firstName}! Now, please select a doctor from the list below:`, 500);
                
                setTimeout(() => {
                    let doctorsHTML = `
                        <div class="message bot-message">
                            <div class="options-container">
                    `;
                    
                    doctors.forEach(doctor => {
                        doctorsHTML += `
                            <button class="option-button doctor-option" data-id="${doctor.id}">
                                <div class="doctor-card">
                                    <div class="doctor-avatar">${doctor.avatar}</div>
                                    <div class="doctor-info">
                                        <div class="doctor-name">${doctor.name}</div>
                                        <div class="doctor-specialty">${doctor.specialty}</div>
                                    </div>
                                </div>
                            </button>
                        `;
                    });
                    
                    doctorsHTML += `
                            </div>
                        </div>
                    `;
                    
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = doctorsHTML;
                    const doctorsElement = tempDiv.firstElementChild;
                    this.messagesContainer.appendChild(doctorsElement);
                    this.messagesContainer.scrollTop = this.messagesContainer.scrollHeight;
                    
                    const doctorOptions = document.querySelectorAll('.doctor-option');
                    doctorOptions.forEach(option => {
                        option.addEventListener('click', (event) => {
                            const doctorId = parseInt(event.currentTarget.getAttribute('data-id'));
                            const selectedDoctor = doctors.find(d => d.id === doctorId);
                            userData.selectedDoctor = selectedDoctor;
                            
                            this.addUserMessage(`I'd like to see ${selectedDoctor.name}`);
                            doctorsElement.style.display = 'none';
                            this.timeSlotSelectionStep();
                        });
                    });
                }, 2000);
            }

            timeSlotSelectionStep() {
                this.currentStep = 'timeSlotSelection';
                this.availableTimeSlots = generateTimeSlots();
                this.addBotMessage(`Great choice! Please select an available time slot for ${userData.selectedDoctor.name}:`, 500);
                
                setTimeout(() => {
                    let slotsHTML = `
                        <div class="message bot-message">
                            <div style="margin-bottom: 10px;">Today</div>
                            <div style="display: flex; flex-wrap: wrap;">
                    `;
                    
                    this.availableTimeSlots.slice(0, 8).forEach(slot => {
                        slotsHTML += `
                            <button class="time-slot" data-id="${slot.id}">${slot.time}</button>
                        `;
                    });
                    
                    slotsHTML += `
                            </div>
                            <div style="margin: 15px 0 10px 0;">Tomorrow</div>
                            <div style="display: flex; flex-wrap: wrap;">
                    `;
                    
                    this.availableTimeSlots.slice(8).forEach(slot => {
                        slotsHTML += `
                            <button class="time-slot" data-id="${slot.id}">${slot.time}</button>
                        `;
                    });
                    
                    slotsHTML += `
                            </div>
                            <div class="button-container" style="margin-top: 15px;">
                                <button class="btn btn-outline" id="backToDoctor">Back to Doctors</button>
                            </div>
                        </div>
                    `;
                    
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = slotsHTML;
                    const slotsElement = tempDiv.firstElementChild;
                    this.messagesContainer.appendChild(slotsElement);
                    this.messagesContainer.scrollTop = this.messagesContainer.scrollHeight;
                    
                    const timeSlots = document.querySelectorAll('.time-slot');
                    timeSlots.forEach(slot => {
                        slot.addEventListener('click', (event) => {
                            const slotId = parseInt(event.currentTarget.getAttribute('data-id'));
                            const selectedSlot = this.availableTimeSlots.find(s => s.id === slotId);
                            userData.selectedTimeSlot = selectedSlot;
                            
                            timeSlots.forEach(s => s.classList.remove('selected'));
                            event.currentTarget.classList.add('selected');
                            
                            // Show confirmation button after selecting a time slot
                            if (!document.getElementById('confirmTimeSlot')) {
                                const confirmButton = document.createElement('button');
                                confirmButton.id = 'confirmTimeSlot';
                                confirmButton.className = 'btn btn-primary';
                                confirmButton.style.marginLeft = '10px';
                                confirmButton.textContent = 'Confirm';
                                document.getElementById('backToDoctor').parentNode.appendChild(confirmButton);
                                
                                // Store the selected time and slot ID for later use
                                const selectedTimeText = event.currentTarget.textContent;
                                const selectedSlotId = slotId;
                                
                                confirmButton.addEventListener('click', () => {
                                    const isToday = selectedSlotId <= 8;
                                    const day = isToday ? 'Today' : 'Tomorrow';
                                    
                                    this.addUserMessage(`I'd like to book for ${day} at ${selectedTimeText}`);
                                    slotsElement.style.display = 'none';
                                    this.appointmentConfirmationStep();
                                });
                            } else {
                                // If confirm button already exists, update the stored time and slot ID
                                const confirmButton = document.getElementById('confirmTimeSlot');
                                const selectedTimeText = event.currentTarget.textContent;
                                const selectedSlotId = slotId;
                                
                                // Remove old event listener
                                const newConfirmButton = confirmButton.cloneNode(true);
                                confirmButton.parentNode.replaceChild(newConfirmButton, confirmButton);
                                
                                // Add new event listener with updated values
                                newConfirmButton.addEventListener('click', () => {
                                    const isToday = selectedSlotId <= 8;
                                    const day = isToday ? 'Today' : 'Tomorrow';
                                    
                                    this.addUserMessage(`I'd like to book for ${day} at ${selectedTimeText}`);
                                    slotsElement.style.display = 'none';
                                    this.appointmentConfirmationStep();
                                });
                            }
                        });
                    });
                    
                    document.getElementById('backToDoctor').addEventListener('click', () => {
                        userData.selectedTimeSlot = null;
                        this.addUserMessage("I'd like to choose a different doctor");
                        slotsElement.style.display = 'none';
                        this.doctorSelectionStep();
                    });
                }, 2000);
            }

            appointmentConfirmationStep() {
                this.currentStep = 'appointmentConfirmation';
                const selectedTimeText = userData.selectedTimeSlot.id <= 8 ? 
                    `Today at ${userData.selectedTimeSlot.time}` : 
                    `Tomorrow at ${userData.selectedTimeSlot.time}`;
                
                this.addBotMessage("Great! Please review your appointment details before confirming:", 500);
                
                setTimeout(() => {
                    const confirmationHTML = `
                        <div class="message bot-message">
                            <div class="summary-container">
                                <div class="summary-row">
                                    <span class="summary-label">Patient:</span>
                                    <span class="summary-value">${userData.firstName} ${userData.lastName}</span>
                                </div>
                                <div class="summary-row">
                                    <span class="summary-label">Doctor:</span>
                                    <span class="summary-value">${userData.selectedDoctor.name}</span>
                                </div>
                                <div class="summary-row">
                                    <span class="summary-label">Specialty:</span>
                                    <span class="summary-value">${userData.selectedDoctor.specialty}</span>
                                </div>
                                <div class="summary-row">
                                    <span class="summary-label">Date & Time:</span>
                                    <span class="summary-value">${selectedTimeText}</span>
                                </div>
                            </div>
                            <div class="button-container" style="margin-top: 15px;">
                                <button class="btn btn-outline" id="backToTimeSlots">Change Time</button>
                                <button class="btn btn-success" id="confirmAppointment">Confirm Appointment</button>
                            </div>
                        </div>
                    `;
                    
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = confirmationHTML;
                    const confirmationElement = tempDiv.firstElementChild;
                    this.messagesContainer.appendChild(confirmationElement);
                    this.messagesContainer.scrollTop = this.messagesContainer.scrollHeight;
                    
                    document.getElementById('backToTimeSlots').addEventListener('click', () => {
                        userData.selectedTimeSlot = null;
                        this.addUserMessage("I'd like to choose a different time");
                        confirmationElement.style.display = 'none';
                        this.timeSlotSelectionStep();
                    });
                    
                    document.getElementById('confirmAppointment').addEventListener('click', () => {
                        this.addUserMessage("I confirm my appointment");
                        confirmationElement.style.display = 'none';
                        this.appointmentSuccessStep();
                    });
                }, 2000);
            }

            appointmentSuccessStep() {
                this.currentStep = 'appointmentSuccess';
                
                const successHTML = `
                    <div class="message bot-message">
                        <div class="confirmation-icon">✓</div>
                        <p style="text-align: center; font-weight: 600; margin-bottom: 15px;">Your appointment has been confirmed!</p>
                        <p style="text-align: center;">We've sent a confirmation email with all the details.</p>
                        <div class="button-container" style="justify-content: center; margin-top: 20px;">
                            <button class="btn btn-primary" id="newAppointment">Book Another Appointment</button>
                        </div>
                    </div>
                `;
                
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = successHTML;
                const successElement = tempDiv.firstElementChild;
                this.messagesContainer.appendChild(successElement);
                this.messagesContainer.scrollTop = this.messagesContainer.scrollHeight;
                
                this.addBotMessage("Thank you for scheduling with us! Is there anything else you need help with?", 2000);
                
                document.getElementById('newAppointment').addEventListener('click', () => {
                    // Reset user data
                    userData = {
                        firstName: userData.firstName,
                        lastName: userData.lastName,
                        dob: userData.dob,
                        selectedDoctor: null,
                        selectedTimeSlot: null
                    };
                    
                    this.addUserMessage("I'd like to book another appointment");
                    this.doctorSelectionStep();
                });
            }
        }

        // Initialize the chat flow when the page loads
        document.addEventListener('DOMContentLoaded', () => {
            new ChatFlow();
        });
    </script>
</body>
</html>
